[project]
name = "agent-bus"
version = "0.1.0"
description = "Message bus between Claude Code sessions on different accounts: an MCP channel, hooks and a skill"
readme = "README.md"
authors = [
    { name = "Andrew Kolpakov", email = "andrew.kolpakov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Channel delivery is proven on 1.x; 2.x rewrites the low-level Server
    # API the channel push depends on (PLAN.md, stage 0 Q1).
    "mcp>=1.30,<2",
    "pydantic>=2.7",
]

[project.scripts]
agent-bus = "agent_bus.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = ["spike", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config"]
xfail_strict = true
