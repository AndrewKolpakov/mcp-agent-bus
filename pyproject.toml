[project]
name = "agent-bus"
version = "1.2.0"
description = "Message bus between Claude Code sessions on different accounts: an MCP channel, hooks and a skill"
readme = "README.md"
authors = [
    { name = "Andrew Kolpakov", email = "andrew.kolpakov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Channel delivery is proven on 1.x; 2.x rewrites the low-level Server
    # API the channel push depends on (PLAN.md, stage 0 Q1).
    "mcp>=1.30,<2",
    "anyio>=4.5",
    "pydantic>=2.7",
    # The hub client (remote.py); the hub Lambda never imports them.
    "httpx>=0.27",
    "websockets>=14",
]

[project.optional-dependencies]
# `agent-bus admin` writes a hub's table with the owner's AWS credentials.
# crt: credentials from `aws login` need it.
admin = ["boto3[crt]>=1.40"]

[project.scripts]
agent-bus = "agent_bus.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pyyaml>=6.0.3",
    "ruff>=0.13",
    "types-pyyaml>=6.0.12.20260906",
    {include-group = "hub"},
]
# The hub Lambda (src/agent_bus/hub): boto3 comes with the Lambda runtime,
# so it is a group here and never a dependency of the client. It rides in
# dev, so the plugin's `uv run --no-dev` leaves it out.
hub = [
    "boto3[crt]>=1.40",
    "boto3-stubs[apigatewaymanagementapi,dynamodb]>=1.40",
    "moto[dynamodb]>=5.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Stage 7 spike: throwaway probes kept as the record of its results.
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = [".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config"]
xfail_strict = true
